sentence=Stepper motor library for PJRC Teensy boards (Teensy 4.0, 4.1, MicroMod, 3.5, 3.6), for drivers with STEP and DIR inputs.
paragraph=Version 3 (beta, the interface can still change in details). Step rates up to 300000 steps/s, up to 16 motors or synchronized groups of motors at the same time, changes of target, speed and acceleration during a move. Sketches written for version 2 still compile. Teensy 3.0 to 3.2, LC and STM32 are not supported by version 3; use version 2.3.4 on these boards.
